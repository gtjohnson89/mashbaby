<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Balloon Pop Party · mashbaby</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <div id="start-gate" class="gate">
    <div class="gate__card">
      <p class="gate__brand">mashbaby</p>
      <h1 class="gate__title">Balloon Pop Party</h1>
      <p class="gate__copy">Mash any key to inflate balloons. They float up… then POP with sparkles!</p>
      <button id="start-btn" class="gate__btn" type="button">Play Full Screen</button>
      <p class="gate__parent">Parent tip: hold <kbd>Esc</kbd> for 2 seconds to exit</p>
    </div>
  </div>

  <div id="game-root" class="game" hidden>
    <div class="sky" aria-hidden="true">
      <div class="cloud cloud--1"></div>
      <div class="cloud cloud--2"></div>
      <div class="cloud cloud--3"></div>
      <div class="sun"></div>
    </div>
    <div class="grass" aria-hidden="true"></div>
    <div id="stage" class="stage" aria-live="polite"></div>
    <div class="hud">
      <p class="hud__hint" id="hint">Mash any key!</p>
      <button id="exit-btn" class="hud__exit" type="button" title="Hold Esc to exit">Exit</button>
    </div>
  </div>

  <script src="sounds.js"></script>
  <script src="game.js"></script>
</body>
</html>
